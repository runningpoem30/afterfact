<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title description">
  <title id="title">Afterhack product architecture</title>
  <desc id="description">Afterhack connects a user interface and FastAPI backend to Vercel AI Gateway and FalkorDB. Sources become quoted evidence and claims, agents retrieve that evidence and produce decisions, and reviewer corrections preserve the old claim while creating new correction evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101817"/><stop offset="1" stop-color="#090d0e"/></linearGradient>
    <linearGradient id="dbfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14251e"/><stop offset="1" stop-color="#101a18"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a9b8b1"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b9e987"/></marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c6a8ff"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#eaf0ec}
      .muted{fill:#aab8b4}.dim{fill:#84938f}.eyebrow{font-size:15px;font-weight:700;letter-spacing:2.3px;fill:#bddc91}.title{font-size:40px;font-weight:700;letter-spacing:-1px}.subtitle{font-size:19px;fill:#afbbb7}
      .section{font-size:16px;font-weight:700;letter-spacing:1.8px;fill:#bac7c1}.cardTitle{font-size:23px;font-weight:700}.cardSub{font-size:16px;fill:#abb9b4}.small{font-size:15px;fill:#aab8b1}.tiny{font-size:13px;fill:#92a19b}.nodeTitle{font-size:17px;font-weight:700}.nodeSub{font-size:14px;fill:#b3c0ba}.rel{font-size:13px;font-weight:700;letter-spacing:.7px;fill:#d0d9d3}
      .card{fill:#12191a;stroke:#303c3d;stroke-width:2}.backend{fill:#151e20;stroke:#637b6b;stroke-width:2.5}.provider{fill:#191523;stroke:#7354a5;stroke-width:2}.database{fill:url(#dbfill);stroke:#80b981;stroke-width:2.5}.node{fill:#18201f;stroke:#42524a;stroke-width:1.7}.source{stroke:#78c99b}.claim{stroke:#c0a0f5}.decision{stroke:#e6b478}.correction{stroke:#ef898a}.connector{fill:none;stroke:#9baba4;stroke-width:3;marker-end:url(#arrow)}.connectorGreen{fill:none;stroke:#b9e987;stroke-width:3.3;marker-end:url(#arrowGreen)}.connectorViolet{fill:none;stroke:#c6a8ff;stroke-width:3;marker-end:url(#arrowViolet)}.softline{fill:none;stroke:#58675f;stroke-width:2;stroke-dasharray:7 8}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="url(#background)"/>
  <circle cx="1530" cy="120" r="240" fill="#203124" opacity=".17"/>
  <circle cx="180" cy="950" r="250" fill="#1a2a28" opacity=".15"/>

  <text x="76" y="68" class="eyebrow">AFTERHACK / SYSTEM MAP</text>
  <text x="76" y="122" class="title">From changing evidence to reviewed agent work</text>
  <text x="76" y="158" class="subtitle">The model reasons. FalkorDB remembers the connected evidence and work. People review corrections.</text>

  <!-- User and browser -->
  <g filter="url(#shadow)">
    <rect x="76" y="235" width="280" height="218" rx="20" class="card"/>
    <rect x="76" y="235" width="280" height="8" rx="4" fill="#b9e987"/>
    <text x="108" y="285" class="section">USER EXPERIENCE</text>
    <text x="108" y="329" class="cardTitle">Engineer</text>
    <text x="108" y="362" class="cardSub">Adds sources · checks claims</text>
    <text x="108" y="389" class="cardSub">asks agents · reviews fixes</text>
    <line x1="108" y1="411" x2="324" y2="411" stroke="#34413b"/>
    <text x="108" y="438" class="small">React / TypeScript web app</text>
  </g>

  <!-- API -->
  <g filter="url(#shadow)">
    <rect x="475" y="204" width="380" height="455" rx="22" class="backend"/>
    <rect x="475" y="204" width="380" height="9" rx="4" fill="#b9e987"/>
    <text x="512" y="257" class="section">APPLICATION BACKEND</text>
    <text x="512" y="302" class="cardTitle">FastAPI</text>
    <text x="512" y="332" class="cardSub">Checks identity and workspace access</text>
    <line x1="512" y1="355" x2="817" y2="355" stroke="#3a4b43"/>
    <circle cx="523" cy="395" r="6" fill="#80d49f"/><text x="543" y="401" class="nodeTitle">Source ingestion</text>
    <text x="543" y="425" class="nodeSub">extract claims · validate quotes</text>
    <circle cx="523" cy="467" r="6" fill="#c6a8ff"/><text x="543" y="473" class="nodeTitle">Agent orchestration</text>
    <text x="543" y="497" class="nodeSub">run tools · hand off · save decisions</text>
    <circle cx="523" cy="539" r="6" fill="#ef898a"/><text x="543" y="545" class="nodeTitle">Correction service</text>
    <text x="543" y="569" class="nodeSub">preview impact · preserve history</text>
    <rect x="512" y="598" width="306" height="34" rx="9" fill="#202b27"/>
    <text x="529" y="621" class="tiny">Graph selection is server-controlled per workspace</text>
  </g>

  <!-- Model provider -->
  <g filter="url(#shadow)">
    <rect x="1050" y="204" width="300" height="202" rx="20" class="provider"/>
    <rect x="1050" y="204" width="300" height="8" rx="4" fill="#c6a8ff"/>
    <text x="1084" y="255" class="section" style="fill:#d2bbff">MODEL PROVIDER</text>
    <text x="1084" y="300" class="cardTitle">Vercel AI Gateway</text>
    <text x="1084" y="334" class="cardSub">Structured extraction</text>
    <text x="1084" y="360" class="cardSub">Analyst + Coordinator reasoning</text>
    <text x="1084" y="386" class="tiny">Server-side key · never sent to browser</text>
  </g>

  <!-- FalkorDB container -->
  <g filter="url(#shadow)">
    <rect x="1015" y="484" width="700" height="490" rx="24" class="database"/>
    <rect x="1015" y="484" width="700" height="9" rx="4" fill="#9ada9b"/>
    <text x="1053" y="536" class="section" style="fill:#b8e7ad">PRIMARY GRAPH DATABASE</text>
    <text x="1053" y="579" class="cardTitle">FalkorDB</text>
    <text x="1053" y="607" class="cardSub">One isolated graph per workspace · persistent source of connected product state</text>

    <!-- core graph nodes -->
    <g>
      <rect x="1054" y="661" width="168" height="100" rx="15" class="node source"/>
      <text x="1075" y="700" class="nodeTitle">Source</text>
      <text x="1075" y="730" class="nodeSub">original document</text>

      <rect x="1280" y="661" width="168" height="100" rx="15" class="node claim"/>
      <text x="1300" y="700" class="nodeTitle">Claim</text>
      <text x="1300" y="730" class="nodeSub">candidate memory</text>

      <rect x="1510" y="623" width="168" height="100" rx="15" class="node decision"/>
      <text x="1530" y="662" class="nodeTitle">Decision</text>
      <text x="1530" y="692" class="nodeSub">agent proposal</text>

      <rect x="1510" y="776" width="168" height="100" rx="15" class="node decision"/>
      <text x="1530" y="815" class="nodeTitle">Action</text>
      <text x="1530" y="845" class="nodeSub">proposed work</text>

      <rect x="1280" y="818" width="168" height="100" rx="15" class="node correction"/>
      <text x="1300" y="857" class="nodeTitle">Correction</text>
      <text x="1300" y="887" class="nodeSub">reviewer-provided</text>
    </g>

    <!-- relations -->
    <path d="M1222 711 L1270 711" class="connectorGreen"/>
    <text x="1227" y="692" class="rel">SUPPORTS</text>
    <path d="M1448 692 C1472 692 1480 672 1500 672" class="connector"/>
    <text x="1454" y="656" class="rel">USED_CLAIM</text>
    <path d="M1594 723 L1594 765" class="connector"/>
    <text x="1605" y="750" class="rel">REQUIRES</text>
    <path d="M1364 818 C1364 791 1364 776 1364 770" class="connectorViolet"/>
    <text x="1378" y="798" class="rel">SUPERSEDES</text>
    <path d="M1360 818 C1326 790 1322 784 1334 770" class="connector"/>
    <text x="1260" y="797" class="rel">CORRECTS</text>

    <line x1="1054" y1="932" x2="1677" y2="932" stroke="#34483a"/>
    <text x="1054" y="957" class="tiny">Quotes, revisions, evidence origin, agent runs, handoffs and audit history are also stored here.</text>
  </g>

  <!-- Main data and control flow -->
  <path d="M356 345 L464 345" class="connectorGreen"/>
  <text x="371" y="326" class="rel">USER INPUT</text>
  <path d="M855 391 C944 391 954 303 1039 303" class="connectorViolet"/>
  <text x="876" y="354" class="rel">EXTRACT / REASON</text>
  <path d="M1050 365 C968 365 947 463 850 463" class="connectorViolet"/>
  <text x="873" y="438" class="rel">STRUCTURED OUTPUT</text>
  <path d="M855 555 C918 555 944 642 1004 674" class="connectorGreen"/>
  <text x="879" y="591" class="rel">READ / WRITE GRAPH</text>
  <path d="M1008 844 C950 844 930 614 855 614" class="connector"/>
  <text x="874" y="829" class="rel">EVIDENCE + DEPENDENCIES</text>
  <path d="M1008 710 C889 710 887 632 855 632" class="softline"/>
  <path d="M458 678 C421 678 400 610 356 421" class="softline" marker-end="url(#arrow)"/>
  <text x="271" y="633" class="tiny" transform="rotate(-17 271 633)">Graph data for readable inspection</text>

  <rect x="76" y="760" width="780" height="214" rx="20" fill="#111718" stroke="#283637" stroke-width="2"/>
  <text x="111" y="811" class="section">THE PRODUCT LOOP</text>
  <text x="111" y="859" class="nodeTitle">1. Add original evidence</text>
  <text x="111" y="889" class="nodeSub">2. Inspect extracted claims and quotes</text>
  <text x="111" y="919" class="nodeSub">3. Correct a claim with reviewer input</text>
  <text x="111" y="949" class="nodeSub">4. Run a fresh agent task and inspect what it cites</text>
  <text x="534" y="859" class="tiny">Correction is not automatic fact verification.</text>
  <text x="534" y="889" class="tiny">Graph reachability indicates possible impact,</text>
  <text x="534" y="913" class="tiny">not proof that every connected decision is wrong.</text>
</svg>
